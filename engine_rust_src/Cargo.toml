[package]
name = "engine_rust"
version = "0.1.2"
edition = "2021"
# Keep cargo test focused on the library + explicit tests.
autobins = false
autotests = false
autobenches = false
autoexamples = false

[lints.rust]
unused_crate_dependencies = "allow"

[lib]
name = "engine_rust"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["ndarray"], optional = true }

# Optional dev-only / heavy features
rayon = { version = "1.10", optional = true }
numpy = { version = "0.23", optional = true }
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py37", "multiple-pymethods"], optional = true }

# WASM components (Feature-gated)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Core dependencies (Optimized)
rand = { version = "0.9.0", default-features = false, features = ["small_rng", "std", "std_rng", "os_rng"] }
rand_pcg = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
bincode = "1.3"

smallvec = { version = "1.13", features = ["serde", "union", "const_generics", "write"] }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
nn = ["dep:ort"]
extension-module = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
gpu = []

[[bin]]
name = "ai_battle"
path = "src/bin/ai_battle.rs"
test = false

[[bin]]
name = "ai_game"
path = "src/bin/ai_game.rs"
test = false

[[bin]]
name = "simple_game"
path = "src/bin/simple_game.rs"
test = false

[[bin]]
name = "test_turn_runner"
path = "src/bin/test_turn_runner.rs"
test = false

[profile.dev]
opt-level = 0
overflow-checks = false
debug = true
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0

[profile.test]
opt-level = 0
overflow-checks = false
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.test.package."*"]
opt-level = 0

[profile.release]
lto = false
codegen-units = 256
panic = 'abort'
opt-level = 3
