opt-level = 0
overflow-checks = false
debug = true
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0

[profile.test]
opt-level = 0
overflow-checks = false
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.test.package."*"]
opt-level = 0

[profile.release]
lto = false
codegen-units = 256
panic = 'abort'
opt-level = 3

