[package]
name = "engine_rust"
version = "0.1.2"
edition = "2021"
# Keep cargo test focused on the library + explicit tests.
autobins = false
autotests = false
autobenches = false
autoexamples = false

[lints.rust]
unused_crate_dependencies = "allow"

[lib]
name = "engine_rust"
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["ndarray"], optional = true }

# Optional dev-only / heavy features
rayon = { version = "1.10", optional = true }
numpy = { version = "0.23", optional = true }
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py37", "multiple-pymethods"], optional = true }

# WASM components (Feature-gated)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Core dependencies (Optimized)
rand = { version = "0.9.0", default-features = false, features = ["small_rng", "std", "std_rng", "os_rng"] }
rand_pcg = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_repr = "0.1"
bincode = "1.3"

smallvec = { version = "1.13", features = ["serde", "union", "const_generics", "write"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
nn = ["dep:ort"]
extension-module = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
gpu = []
perf_profile = []

[[bin]]
name = "bench_diagnostic"
path = "examples/bench_diagnostic.rs"
test = false

[[bin]]
name = "bench_deterministic"
path = "examples/bench_deterministic.rs"
test = false

[[bin]]
name = "bench_granular_v2"
path = "examples/bench_granular_v2.rs"
test = false

[[bin]]
name = "bench_throughput"
path = "examples/bench_throughput.rs"
test = false

[[bin]]
name = "debug_game_log"
path = "examples/debug_game_log.rs"
test = false

[[bin]]
name = "bench_fast"
path = "examples/bench_fast.rs"
test = false

[[bin]]
name = "search_fastest_terminal_turn"
path = "examples/search_fastest_terminal_turn.rs"
test = false

[[bin]]
name = "simple_game"
path = "src/bin/simple_game.rs"
test = false

[[bin]]
name = "abilities_game"
path = "src/bin/abilities_game.rs"
test = false

[[bin]]
name = "proper_game_log"
path = "examples/proper_game_log.rs"
test = false

[[bin]]
name = "simple_game_log"
path = "examples/simple_game_log.rs"
test = false

[[bin]]
name = "micro_liveset"
path = "examples/micro_liveset.rs"
test = false

[[bin]]
name = "deep_liveset"
path = "examples/deep_liveset.rs"
test = false

[[bin]]
name = "export_hydrated_abilities"
path = "examples/export_hydrated_abilities.rs"
test = false

[[bench]]
name = "ultimate_benchmark"
path = "benches/ultimate_benchmark.rs"
harness = false

[[test]]
name = "export_hydrated_abilities"
path = "tests/export_hydrated_abilities.rs"

[profile.dev]
opt-level = 0
overflow-checks = false
debug = "line-tables-only"
incremental = true
codegen-units = 256
panic = 'abort'
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 0
overflow-checks = false
debug = "line-tables-only"
incremental = true
codegen-units = 256
lto = false
split-debuginfo = "packed"

[profile.test.package."*"]
opt-level = 1

[profile.bench-fast]
inherits = "release"
codegen-units = 256
lto = false
opt-level = 2
panic = 'abort'

[profile.test-fast]
inherits = "test"
codegen-units = 256
opt-level = 1

[profile.test-fast.package."*"]
opt-level = 2

[profile.release]
lto = false
codegen-units = 256
panic = 'abort'
opt-level = 3

[[test]]
name = "qa_verification_tests"
path = "tests/qa_verification_tests.rs"

[[test]]
name = "card574_self_discard"
path = "tests/card574_self_discard.rs"
